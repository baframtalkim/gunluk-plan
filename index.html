<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{--bg:#eef1f6;--ink:#14213d;--mut:#5d6985;--ln:#d5dbe7;--ac:#2f5bea;--rd:#c93c3c;--sf:#fff;--f:'Bricolage Grotesque',system-ui,sans-serif;--s:'Source Serif 4',Georgia,serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.rail{background:var(--ink);color:#e8ecf6;padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.rail h1{font-size:17px;margin:0 6px 14px;font-weight:700}
.rail button{all:unset;cursor:pointer;padding:9px 10px;border-radius:7px;color:#b9c3dc}
.rail button:hover{background:#ffffff14}.rail button.on{background:#fff;color:var(--ink);font-weight:700}
.rail button:focus-visible{outline:2px solid #8fb0ff}.rail hr{border:0;border-top:1px solid #ffffff22;margin:10px 0;width:100%}
main{padding:22px clamp(14px,3vw,34px);min-width:0}
h2{margin:0;font-size:24px}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.top .sp{flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin-bottom:18px}

.btn:hover{border-color:var(--ac)}.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.d{color:var(--rd)}.btn:disabled{opacity:.5;cursor:wait}
input[type=text],input[type=date],select,textarea{width:100%;border:1px solid var(--ln);border-radius:8px;padding:8px 10px;background:#fff}

.page td,.page th{border:1px solid #c5cddf;padding:.32em .55em;vertical-align:top;text-align:left}

.page h1,.page h2,.page h3{margin:.4em 0 .25em;font-family:var(--f);color:#14213d}.page h1{font-size:1.4em;text-align:center}.page h2{font-size:1.2em}.page h3{font-size:1.1em}

</style></head><body>
<div class="app"><nav class="rail" id="rail"></nav><main id="main"></main></div><div id="toast"></div>
<script>
/* ============ MİMARİ (Kotlin'e çevirme haritası) ============
 Domain modelleri  : Settings, ApiKey, Grade, Plan            -> Kotlin data class
 Repo              : load()/save()                            -> Room / DataStore arayüzü
 KeyPool           : order()                                  -> ayrı sınıf (en az token önce)
 WeekService       : of(date)                                 -> saf fonksiyon (java.time)
 DocReader         : read(file)                               -> PdfRenderer/PDFBox + docx (POI)
 GeminiClient      : gemini(prompt)                           -> Retrofit/Ktor
 PlanService       : generate(grade,date)                     -> UseCase
 Exporter          : toPdf / toDocx                           -> PdfDocument / POI
 UI                : render*()                                -> Jetpack Compose ekranları
 Not: Domain/servis katmanları DOM'a bağlı değildir; sadece UI ve Exporter tarayıcıya özeldir. */

const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=d=>String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
const DAYS=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',4500)}

/* ---- Repo ---- */
/* Android uygulamasında (WebView) veriler telefondaki dosyalara yazılır; tarayıcıda localStorage kullanılır */
const AND=window.Android||null;
const Repo={k:'gpa.v1',load(){try{const t=AND?AND.read('state.json'):localStorage.getItem(this.k);return t?JSON.parse(t):null}catch(e){return null}},
 save(s){try{if(AND){if(!AND.write('state.json',JSON.stringify(s)))throw 0}else localStorage.setItem(this.k,JSON.stringify(s))}catch(e){toast('Kayıt yapılamadı: depolama alanı dolu veya erişilemiyor.')}}};
let S=Repo.load()||{settings:{},keys:[],grades:[]};
S.settings=Object.assign({school:'',teacher:'',teacherTitle:'',principal:'',principalTitle:'Okul Müdürü',start:'',end:'',b1:'',sem:'',b2:'',model:'gemini-3.8-flash'},S.settings);
S.grades.forEach(g=>{g.sections=g.sections||[]});
const save=()=>Repo.save(S);
let UI={gid:null,tab:'uret',date:iso(new Date()),view:null,busy:false,err:''};
let STAGE='';
const G=()=>S.grades.find(g=>g.id===UI.gid);

/* ---- KeyPool: en az token kullanan anahtar önce ---- */
const Pool={order(){const t=iso(new Date());S.keys.forEach(k=>{if(k.day!==t){k.day=t;k.tokens=0}});
 return S.keys.filter(k=>k.on!==false&&(k.cool||0)<Date.now()).sort((a,b)=>a.tokens-b.tokens)}};

/* ---- GeminiClient ---- */
const FALLBACK=['gemini-3.8-flash','gemini-flash-latest','gemini-flash-lite-latest'];
async function geminiOnce(prompt,model,files,json){
 const order=Pool.order();
 if(!order.length)throw new Error('Kullanılabilir API anahtarı yok. Ayarlar bölümünden anahtar ekleyin.');
 let last='',fails=0;
 for(const k of order){
  try{
   const ac=new AbortController(),to=setTimeout(()=>ac.abort(),180000);
   const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{method:'POST',signal:ac.signal,
    headers:{'Content-Type':'application/json','x-goog-api-key':k.key},
    body:JSON.stringify({contents:[{role:'user',parts:[...(files||[]).map(f=>({inlineData:{mimeType:f.mime,data:f.data}})),{text:prompt}]}],generationConfig:{maxOutputTokens:16000,...(json?{responseMimeType:'application/json'}:{})}})});
   const j=await r.json();clearTimeout(to);
   if(r.ok){k.tokens+=j.usageMetadata?.totalTokenCount||0;k.last='Çalıştı';save();
    const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');if(t)return t;last='Boş yanıt';continue}
   const msg=j.error?.message||String(r.status);last=msg;
   if(r.status===404||/no longer available|deprecated/i.test(msg)){const er=new Error(msg);er.model=true;throw er}
   if(r.status===429){k.cool=Date.now()+5*60000;k.last='Kota doldu'}
   else if(r.status===403||/api key/i.test(msg)){k.cool=Date.now()+3600000;k.last='Geçersiz/yetkisiz'}
   else if(r.status>=500){k.last='Sunucu hatası '+r.status+': '+msg.slice(0,90);if(++fails>=2){const er=new Error('Google sunucu hatası ('+r.status+'): '+msg.slice(0,200));er.model=true;last=er.message;throw er}}
   else throw new Error(msg);
   save();
  }catch(e){if(e.name==='AbortError')throw new Error('Zaman aşımı: Gemini 3 dakika içinde yanıt vermedi. Tekrar deneyin, kitap seçeneğini kapatın veya Ayarlardan başka model seçin.');if(e.message===last)throw e;last=e.message}
 }
 throw new Error('Tüm anahtarlar denendi: '+last);
}
/* Model kullanımdan kalktıysa otomatik olarak sıradaki modeli dener */
async function gemini(prompt,files,json){
 const tried=new Set();let m=S.settings.model;
 for(;;){
  try{const out=await geminiOnce(prompt,m,files,json);if(m!==S.settings.model){S.settings.model=m;save()}return out}
  catch(e){if(!e.model)throw e;tried.add(m);
   const next=[...(S.models||[]),...FALLBACK].find(x=>!tried.has(x));
   if(!next)throw new Error('Hiçbir model kullanılamadı. Ayarlar > Kullanılabilir modelleri getir düğmesini deneyin. ('+e.message+')');
   m=next;toast('Model deneniyor: '+m)}
 }
}

/* ---- WeekService ---- */
const Week={
 monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x},
 breaks(){const t=S.settings;return[[t.b1,7],[t.sem,14],[t.b2,7]].filter(x=>x[0]).map(([d,n])=>{const a=new Date(d+'T00:00'),b=new Date(a);b.setDate(b.getDate()+n-1);b.setHours(23,59);return[a,b]})},
 work(d,br){const t=S.settings,s=new Date(t.start+'T00:00'),e=t.end?new Date(t.end+'T23:59'):null;
  return d.getDay()%6!==0&&d>=s&&(!e||d<=e)&&!br.some(([a,b])=>d>=a&&d<=b)},
 of(date){if(!S.settings.start)return null;const br=this.breaks(),s=this.monday(new Date(S.settings.start+'T00:00')),t=this.monday(new Date(date+'T00:00'));
  const wk=m=>[...Array(5)].map((_,i)=>{const d=new Date(m);d.setDate(d.getDate()+i);return d});
  const days=wk(t),work=days.filter(d=>this.work(d,br));
  if(t<s)return{no:0,days,work};let n=0;for(let m=new Date(s);m<=t;m.setDate(m.getDate()+7))if(wk(m).some(d=>this.work(d,br)))n++;
  return{no:n,days,work,brk:!work.length}}
};
const sf=(k,l,h)=>`<div><label class="f">${l}</label><input type="date" data-s="${k}" value="${S.settings[k]||''}" style="width:auto">${h?` <span class="mut">${h}</span>`:''}</div>`;
const endOf=(k,n)=>{const v=S.settings[k];if(!v)return'';const d=new Date(v+'T00:00');d.setDate(d.getDate()+n-1);return'bitiş: '+fmt(d)};

/* ---- DocReader ---- */
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
async function readDoc(f){
 const buf=await f.arrayBuffer();
 if(/\.docx$/i.test(f.name))return(await mammoth.extractRawText({arrayBuffer:buf})).value;
 if(/\.pdf$/i.test(f.name)){const pdf=await pdfjsLib.getDocument({data:buf}).promise;let out='';
  for(let i=1;i<=pdf.numPages;i++){const c=await(await pdf.getPage(i)).getTextContent();let y=null;
   c.items.forEach(it=>{const yy=it.transform[5];if(y!==null&&Math.abs(yy-y)>4)out+='\n';else if(y!==null)out+=' ';out+=it.str;y=yy});out+='\n\n'}
  return out}
 throw new Error('Yalnızca PDF veya DOCX yükleyin.');
}

/* ---- Ders kitabı deposu (IndexedDB) ---- */
const Books={mem:{},db:null,open(){return this.db||(this.db=new Promise((ok,no)=>{try{const r=indexedDB.open('gpa-books',1);r.onupgradeneeded=()=>r.result.createObjectStore('b');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}}))},
 async tx(m,fn){const db=await this.open();return new Promise((ok,no)=>{const t=db.transaction('b',m),q=fn(t.objectStore('b'));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})},
 /* Önce IndexedDB, olmazsa localStorage, o da olmazsa yalnızca bellek */
 async get(id){if(AND){const t=AND.read('book-'+id+'.json');return t?JSON.parse(t):undefined}try{const v=await this.tx('readonly',x=>x.get(id));if(v)return v}catch(e){}
  try{const v=localStorage.getItem('gpa-book-'+id);if(v)return JSON.parse(v)}catch(e){}
  return this.mem[id]},
 async set(id,v){if(AND){if(AND.write('book-'+id+'.json',JSON.stringify(v)))return 'file';throw new Error('Kitap dosyaya yazılamadı.')}try{await this.tx('readwrite',x=>x.put(v,id));return 'idb'}catch(e){}
  try{localStorage.setItem('gpa-book-'+id,JSON.stringify(v));return 'ls'}catch(e){}
  this.mem[id]=v;return 'mem'},
 async del(id){if(AND)AND.remove('book-'+id+'.json');delete this.mem[id];try{localStorage.removeItem('gpa-book-'+id)}catch(e){}try{await this.tx('readwrite',x=>x.delete(id))}catch(e){}}};
async function pdfPages(f,cb){const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,out=[];
 for(let i=1;i<=pdf.numPages;i++){const c=await(await pdf.getPage(i)).getTextContent();let y=null,t='';
  c.items.forEach(it=>{const yy=it.transform[5];if(y!==null&&Math.abs(yy-y)>4)t+='\n';else if(y!==null)t+=' ';t+=it.str;y=yy});
  out.push(t);if(cb&&i%10===0)cb(i,pdf.numPages)}return out}
/* Anahtar kelimelere göre en uygun ardışık sayfaları bulur */
const norm=t=>t.toLocaleLowerCase('tr').replace(/[^a-zçğıöşü0-9 ]/g,' ');
function pickBook(pages,kw,win=6,cap=14000){
 const words=[...new Set(kw.flatMap(k=>norm(k).split(/\s+/)).filter(w=>w.length>3))],ph=kw.map(k=>norm(k).trim()).filter(k=>k.includes(' '));
 const sc=pages.map(p=>{const t=norm(p);let n=0;words.forEach(w=>{n+=t.split(w).length-1});ph.forEach(f=>{n+=3*(t.split(f).length-1)});return n});
 let best=0,bi=-1;for(let i=0;i<pages.length;i++){let n=0;for(let j=i;j<Math.min(i+win,pages.length);j++)n+=sc[j];if(n>best){best=n;bi=i}}
 if(bi<0)return null;let txt='',end=bi;
 for(let j=bi;j<Math.min(bi+win,pages.length);j++){if(txt.length+pages[j].length>cap)break;txt+=`\n[Sayfa ${j+1}]\n`+pages[j];end=j}
 return{from:bi+1,to:end+1,text:txt}}
const tf=(k,l,ph)=>`<label class="f">${l}</label><input type="text" data-s="${k}" value="${esc(S.settings[k])}" placeholder="${ph||''}">`;

/* ---- PlanService ---- */
const clean=h=>{const d=new DOMParser().parseFromString(h,'text/html');d.querySelectorAll('script,iframe,object,embed,link,style').forEach(e=>e.remove());
 d.querySelectorAll('*').forEach(e=>[...e.attributes].forEach(a=>/^on/i.test(a.name)&&e.removeAttribute(a.name)));return d.body.innerHTML};
/* ---- Ders programı yardımcıları ---- */
const slotTxt=a=>{if(!a||!a.length)return'';const c=a.every((v,i)=>!i||v===a[i-1]+1);return c?(a.length>1?a[0]+'-'+a[a.length-1]:a[0])+'. ders':a.join(' ve ')+'. ders'};
/* Haftanın plan birimleri: her şube için yalnızca o şubenin ders günleri.
   Ders programı girilmemişse tek birim (tüm iş günleri). */
function unitsFor(g,w){
 if(!hasSched(g))return[{sec:null,days:w.work,hrs:w.work.map(()=>0),slots:w.work.map(()=>null),sig:'tum'}];
 const us=[];
 g.sections.filter(x=>x.name).forEach(sec=>{
  const ds=w.work.filter(d=>+((sec.sched||{})[d.getDay()-1]||0)>0);
  if(!ds.length)return;
  const hrs=ds.map(d=>+sec.sched[d.getDay()-1]);
  us.push({sec,days:ds,hrs,slots:ds.map(d=>S.tt&&!S.tt.mig?((sec.slots||{})[d.getDay()-1]||null):null),sig:hrs.join(',')})});
 return us}
const sigHTML=()=>{const t=S.settings,c=(n,ti)=>`<div class="sc"><div class="sp"></div><div class="sl"></div><b class="nm">${esc(n)}</b><div class="ti">${esc(ti)}</div></div>`;
 return`<div class="sig">${c(t.teacher,t.teacherTitle||'Öğretmen')}${c(t.principal,t.principalTitle||'Okul Müdürü')}</div>`};
const hdrHTML=(meta)=>`<div class="bar"></div><div class="sh">${S.settings.school?`<div class="sn">${esc(S.settings.school)}</div>`:''}<div class="st">GÜNLÜK DERS PLANI</div><div class="sm">${meta}</div></div>`;
/* Eski sürümde üretilmiş planları da yeni tasarıma ve güncel imza bilgisine çevirir */
function upgradeHtml(html){const d=new DOMParser().parseFromString(html,'text/html');
 d.querySelectorAll('.page').forEach(p=>{
  if(!p.querySelector('.bar'))p.insertAdjacentHTML('afterbegin','<div class="bar"></div>');
  const sh=p.querySelector('.sh');if(sh&&!sh.querySelector('.st')){const sm=sh.querySelector('.sm');if(sm)sm.insertAdjacentHTML('beforebegin','<div class="st">GÜNLÜK DERS PLANI</div>')}
  if(sh){const sn=sh.querySelector('.sn');if(sn)sn.textContent=S.settings.school||sn.textContent}
  const old=p.querySelector('.sig');if(old)old.remove();p.insertAdjacentHTML('beforeend',sigHTML())});
 return d.body.innerHTML}
function decorate(h,g,w,u){
 const d=new DOMParser().parseFromString(h,'text/html'),secs=g.sections.filter(x=>x.name),ld=u.days;
 d.querySelectorAll('section').forEach((x,i)=>{const k=Math.min(i,ld.length-1),dt=ld[k];
  let sub='';
  if(u.sec)sub=` · ${u.hrs[k]} ders saati${u.slots[k]?' ('+slotTxt(u.slots[k])+')':''}`;
  else if(secs.length)sub=` · ${secs.map(y=>`${esc(y.name)}: ${wk(y)} saat/hafta`).join(', ')}`;
  const meta=`${esc(g.name)}${u.sec?' · '+esc(u.sec.name):''} · ${DAYS[dt.getDay()]} ${fmt(dt)} · ${w.no}. hafta${sub}`;
  x.className='page';x.innerHTML=hdrHTML(meta)+'<div class="pc">'+x.innerHTML+'</div>'+sigHTML()});
 return d.body.innerHTML}
const TURLER=['icerik','kazanim','konu','tarih','gun','ders_saati','diger'];
async function getTemplate(g){
 const sm=g.sample;if(sm.tpl)return sm.tpl;
 if(!sm.html&&!sm.b64)return null;
 STAGE='Örnek plan şablonu çıkarılıyor…';
 const files=[];if(!sm.html&&sm.b64)files.push({mime:'application/pdf',data:sm.b64});
 const src=sm.html?`ÖRNEK PLAN HTML:\n"""${sm.html.slice(0,30000)}"""`:`ÖRNEK PLAN METNİ (ekli PDF'e de bak):\n"""${sm.text.slice(0,15000)}"""`;
 const r=await gemini(`Aşağıda bir öğretmenin günlük ders planı örneği var. Bunu doldurulabilir bir ŞABLONA çevir.

 const html=plans.map(p=>upgradeHtml(p.html)).join('');const old=btn?.textContent;if(btn){btn.disabled=true;btn.textContent='Hazırlanıyor…'}
 try{fmt==='pdf'?await toPdf(html,name):await toDocx(html,name)}catch(e){toast('Dışa aktarma hatası: '+e.message)}
 if(btn){btn.disabled=false;btn.textContent=old}
}

/* ============ UI ============ */

 $('#rail').innerHTML='<h1>Günlük Plan Asistanı</h1>'+S.grades.map(g=>`<button data-a="grade" data-id="${g.id}" class="${UI.gid===g.id?'on':''}">${esc(g.name)}</button>`).join('')
 +'<button data-a="addGrade">+ Sınıf ekle</button><hr><button data-a="program" class="'+(UI.gid==='program'?'on':'')+'">Ders programım</button><button data-a="settings" class="'+(UI.gid==='settings'?'on':'')+'">Ayarlar</button>';
}
function renderMain(){

 if(!g)return m.innerHTML=`<div class="card"><h2>Başlayalım</h2><p class="mut">1) Ayarlar'dan API anahtarlarını ve okul başlangıç tarihini girin. 2) Sol menüden bir sınıf ekleyin. 3) Yıllık planı ve örnek günlük planı bir kez yükleyin.</p><button class="btn p" data-a="addGrade">Sınıf ekle</button></div>`;

 <div class="tabs">${tabs.map(t=>`<button data-a="tab" data-id="${t[0]}" class="${UI.tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div>`

function genHTML(g){return`<div class="card"><label class="f">Tarih (geriye dönük için eski bir tarih seçin)</label>
 <div class="row"><button class="btn" data-a="shift" data-id="-7">‹ Önceki hafta</button><input type="date" id="dt" value="${UI.date}" style="width:auto"><button class="btn" data-a="shift" data-id="7">Sonraki hafta ›</button><button class="btn" data-a="today">Bugün</button></div>
 <div class="week"><b id="wno">–</b><span id="wtxt"></span></div><div class="warn" id="wwarn"></div><div id="wprev" class="mut"></div>
 <label class="f">Öğretmen notu (isteğe bağlı)</label><textarea id="note" placeholder="Örn. Cuma günü okul gezisi var, tekrar etkinliği ekle."></textarea>
 ${g.book?'<label class="f" style="color:var(--ink)"><input type="checkbox" id="usebook" checked> Ders kitabından ilgili bölümü içeriğe ekle <span class="mut">(ek token harcar)</span></label>':'<p class="mut">Ders kitabı yüklenmedi. Dosyalar sekmesinden PDF olarak ekleyebilirsiniz.</p>'}
 <div class="warn" id="gerr">${esc(UI.err||'')}</div><p><button class="btn p" data-a="gen" id="genb">Haftanın planını üret</button></p></div>`}
function updWeek(){const w=Week.of(UI.date);if(!$('#wno'))return;
 if(!w){$('#wno').textContent='–';$('#wtxt').textContent='';$('#wwarn').textContent='Ayarlar bölümünden okulun ilk gün tarihini girin.';return}
 const ok=w.no>=1&&w.work.length;
 $('#wno').textContent=ok?w.no:'–';
 $('#wtxt').textContent=ok?`. hafta · ${fmt(w.work[0])} – ${fmt(w.work[w.work.length-1])} · ${w.work.length} iş günü`:'Plan üretilecek ders günü yok';
 $('#wwarn').textContent=w.no<1?'Seçilen tarih okul başlangıcından önce.':!w.work.length?'Bu hafta tatil veya okul takvimi dışında.':'';
 const g=G(),pv=$('#wprev');if(!pv||!g)return;
 if(!ok){pv.innerHTML='';return}
 if(!hasSched(g)){pv.innerHTML='Ders programı girilmediği için tek plan, tüm iş günleri için üretilir. Şube bazlı plan için “Şubeler” sekmesinde şube ekleyip “Ders programım” bölümünü doldurun.';return}
 const us=unitsFor(g,w),skip=g.sections.filter(x=>x.name&&!us.some(u=>u.sec===x));
 pv.innerHTML='<b style="color:var(--ink)">Bu hafta üretilecek planlar</b><br>'+(us.length?us.map(u=>`<b>${esc(u.sec.name)}</b>: ${u.days.map((d,i)=>`${DN[d.getDay()-1]} ${fmt(d)} (${u.hrs[i]} saat)`).join(', ')}`).join('<br>'):'Bu hafta dersi olan şube yok.')
  +(skip.length?`<br>Bu hafta dersi olmayan: ${skip.map(x=>esc(x.name)).join(', ')}`:'')}
const DN=['Pzt','Sal','Çar','Per','Cum'],DNF=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma'];
const wk=x=>{const v=Object.values(x.sched||{});return v.length?v.reduce((a,b)=>a+ +b,0):(+x.hours||0)};
const dayHours=(g,i)=>g.sections.filter(x=>x.name).map(x=>({n:x.name,h:+((x.sched||{})[i]||0)})).filter(x=>x.h>0);
const hasSched=g=>g.sections.some(x=>x.name&&Object.values(x.sched||{}).some(v=>+v>0));
/* ---- Öğretmenin haftalık ders programı: S.tt.d[gün][ders saati] = "sınıfId:şubeId" ---- */
function ttSync(){
 const T=S.tt,ix={};
 S.grades.forEach(g=>g.sections.forEach(x=>{ix[g.id+':'+x.id]=x;x.sched={};x.slots={};x.hours=0}));
 for(let d=0;d<5;d++){
  const row=Array.from({length:T.n},(_,p)=>{const k=(T.d[d]||[])[p];return ix[k]?k:''});T.d[d]=row;
  row.forEach((k,p)=>{const x=ix[k];if(x){x.sched[d]=(x.sched[d]||0)+1;(x.slots[d]=x.slots[d]||[]).push(p+1)}})}
 S.grades.forEach(g=>g.sections.forEach(x=>{x.hours=wk(x)}));
}
function fixSig(){const t=S.settings,r=/\s[–—-]\s/;
 if(!t.teacherTitle&&r.test(t.teacher||'')){const m=t.teacher.split(r);t.teacher=m[0].trim();t.teacherTitle=m.slice(1).join(' – ').trim()}}
function ttInit(){fixSig();
 if(!S.tt||!Array.isArray(S.tt.d)){
  /* Eski sürümde girilmiş şube gün/saatleri varsa sırayla yerleştirilir; kaçıncı ders olduğu kullanıcıdan onay bekler */
  const d=[0,1,2,3,4].map(i=>{const row=[];S.grades.forEach(g=>g.sections.forEach(x=>{for(let k=0;k<+((x.sched||{})[i]||0);k++)row.push(g.id+':'+x.id)}));return row});
  S.tt={n:Math.max(8,...d.map(r=>r.length)),d,mig:d.some(r=>r.length>0)};
 }
 S.tt.n=+S.tt.n||8;ttSync();
}
const ttOpts=sel=>'<option value="">—</option>'+S.grades.flatMap(g=>g.sections.filter(x=>x.name).map(x=>{const k=g.id+':'+x.id;return`<option value="${k}" ${sel===k?'selected':''}>${esc(x.name)} · ${esc(g.name)}</option>`})).join('');
const secSum=x=>Object.entries(x.sched||{}).filter(([,v])=>+v>0).map(([i,v])=>DN[i]+' '+v).join(', ');
function subeHTML(g){const tot=g.sections.reduce((a,x)=>a+wk(x),0);
 return`<div class="card"><b>Şubeler</b><p class="mut">Bu dersin şubelerini (9-A, 9-B…) ekleyin. Şubenin hangi gün ve kaçıncı derste olduğu <b>Ders programım</b> bölümünde seçilir. Plan, her şube için yalnızca o şubenin ders günlerine üretilir; haftalık ders saati dağılımı aynı olan şubelerin içeriği ortaktır, tarihleri kendi ders günlerine göre yazılır.</p>`

 +`<p><button class="btn" data-a="addSec">+ Şube ekle</button> <button class="btn" data-a="program">Ders programıma git</button> <span class="mut">Toplam: ${tot} saat / hafta</span></p></div>`}
function programHTML(){const w=Week.of(UI.date),T=S.tt,nS=S.grades.reduce((a,g)=>a+g.sections.filter(x=>x.name).length,0);
 const cnt=d=>T.d[d].filter(Boolean).length,tot=[0,1,2,3,4].reduce((a,d)=>a+cnt(d),0);
 const days=DNF.map((n,d)=>`<div class="card"><div class="row"><b>${n}</b><span class="mut">${cnt(d)} ders</span></div>`
  +T.d[d].map((k,p)=>`<div class="row" style="margin-top:6px;flex-wrap:nowrap"><span class="mut" style="width:56px;flex:none">${p+1}. ders</span><select data-tt="${d}:${p}" style="flex:1;min-width:0">${ttOpts(k)}</select></div>`).join('')+'</div>').join('');
 const sum=S.grades.flatMap(g=>g.sections.filter(x=>x.name).map(x=>`<div class="item"><span><b>${esc(x.name)}</b> · ${esc(g.name)}</span><span class="mut">${wk(x)?wk(x)+' saat/hafta · '+secSum(x):'programda yok'}</span></div>`)).join('');
 const ns=[...new Set([6,7,8,9,10,11,12,T.n])].sort((a,b)=>a-b);
 return`<div class="top"><h2>Ders programım</h2></div>`
 +(T.mig?`<div class="card"><b>Ders saatlerini kontrol edin</b><p class="mut">Önceki ayarlarınızdaki gün ve saat bilgileri aşağıya sırayla (1. ders, 2. ders…) yerleştirildi. Gerçek ders saatlerinize göre düzeltin, sonra onaylayın. Onaylayana kadar planlarda “kaçıncı ders” bilgisi yazılmaz.</p><button class="btn p" data-a="ttOk">Doğru, onayla</button></div>`:'')
 +(nS?'':`<div class="card warn">Önce sol menüden bir sınıf/ders ekleyip “Şubeler” sekmesinde şubeleri (9-A, 9-B…) oluşturun.</div>`)
 +`<div class="card"><p class="mut">Her gün için hangi derste hangi şubeye girdiğinizi seçin; boş bırakılan saatlerde ders yok sayılır. Plan yalnızca dersiniz olan günler için, her şubeye ayrı üretilir.</p><div class="row"><label class="mut">Günlük ders saati sayısı <select data-ttn="1" style="width:auto">${ns.map(n=>`<option ${n===T.n?'selected':''}>${n}</option>`).join('')}</select></label><span class="mut">Toplam: ${tot} saat / hafta</span></div></div>`
 +`<div class="ttg">${days}</div>`
 +`<div class="card"><b>Şubelere göre haftalık ders</b>${sum||'<p class="mut">Şube yok.</p>'}</div>`
 +`<div class="card"><b>Tüm dersler için plan üret</b><label class="f">Tarih</label><div class="row"><input type="date" id="pdt" value="${UI.date}" style="width:auto"><span class="mut">${w&&w.no>0?w.no+'. hafta':''}</span></div>
 <div class="warn">${esc(UI.err||'')}</div><p><button class="btn p" data-a="genAll" id="genall">Programdaki tüm sınıflar için üret</button></p></div>`}
function planRow(p){const t=`${p.week}. hafta${p.secName?' · '+esc(p.secName):''}`;
 return`<div class="item"><div><b>${t}</b> <span class="mut">${fmt(new Date(p.from+'T00:00'))} – ${fmt(new Date(p.to+'T00:00'))} · ${p.html.split(/<section/i).length-1} sayfa</span></div>
 <div class="row"><button class="btn" data-a="open" data-id="${p.id}">Aç / düzenle</button><button class="btn" data-a="exp" data-f="pdf" data-id="${p.id}">PDF</button><button class="btn" data-a="exp" data-f="docx" data-id="${p.id}">DOCX</button><button class="btn d" data-a="delPlan" data-id="${p.id}">Sil</button></div></div>`}

 +`<div class="item"><span class="mut">Tüm planlar tek dosyada</span><div class="row"><button class="btn" data-a="expAll" data-f="pdf">PDF</button><button class="btn" data-a="expAll" data-f="docx">DOCX</button></div></div>`:'<p class="mut">Henüz plan yok. “Plan üret” sekmesinden başlayın.</p>')+`</div>`

function viewerHTML(p){return`<div class="card"><div class="top"><b>${p.week}. hafta planı${p.secName?' · '+esc(p.secName):''}</b><span class="sp"></span><span class="mut">Metne tıklayıp doğrudan düzeltebilirsiniz</span><button class="btn p" data-a="savePlan" data-id="${p.id}">Kaydet</button><button class="btn" data-a="close">Kapat</button></div>

function fileHTML(g){const one=(k,t)=>{const f=g[k];return`<div class="card"><b>${t}</b>`+(f?`<div class="item"><span>${esc(f.name)} <span class="mut">· ${f.text.length.toLocaleString('tr')} karakter</span></span><button class="btn d" data-a="delFile" data-id="${k}">Sil</button></div>

 +`<label class="btn" style="margin-top:8px">${f?'Değiştir':'PDF / DOCX yükle'}<input type="file" hidden accept=".pdf,.docx" data-f="${k}"></label></div>`};
 const bk=g.book?`<div class="item"><span>${esc(g.book.name)} <span class="mut">· ${g.book.n} sayfa</span></span><button class="btn d" data-a="delFile" data-id="book">Sil</button></div>`:'<p class="mut">Yüklenmedi.</p>';

function tplHTML(g){const t=g.sample&&g.sample.tpl;if(!g.sample)return'';

 const T=[['icerik','İçerik (ders kitabından)'],['kazanim','Kazanım (yıllık plandan)'],['konu','Konu / Ünite'],['tarih','Tarih'],['gun','Gün'],['ders_saati','Ders saati'],['diger','Diğer']];
 return`<div class="card"><b>Şablon alanları</b><p class="mut">Örnek plandan tanınan bölümler. “İçerik” türündeki alanlar ders kitabından doldurulur. Yanlış tanındıysa türünü değiştirin.</p>`

 +`<p><button class="btn" data-a="resetTpl">Şablonu yeniden çıkar</button></p></div>`}
function settingsHTML(){const o=Pool.order().map(k=>k.id);const s=S.settings;
 return`<div class="top"><h2>Ayarlar</h2></div><div class="card"><b>Okul ve imza bilgileri</b>${tf('school','Okulun adı','Örn. Atatürk Anadolu Lisesi')}${tf('teacher','Ders öğretmeninin adı soyadı (sayfanın sol altında imza)','Örn. Ayşe Kaya')}${tf('teacherTitle','Ders öğretmeninin unvanı (adın altında yazılır)','Örn. Matematik Öğretmeni')}${tf('principal','Okul müdürünün adı soyadı (sayfanın sağ altında imza)','Örn. Mehmet Demir')}${tf('principalTitle','Okul müdürünün unvanı (adın altında yazılır)','Okul Müdürü')}</div><div class="card"><b>Okul takvimi</b><p class="mut">Cumartesi ve Pazar günleri otomatik hafta sonu tatili sayılır. Ara tatil ve yarıyıl tatilinde yalnızca başlangıç tarihini girin, bitiş tarihi otomatik hesaplanır.</p>${sf('start','Okulun ilk günü')}${sf('b1','1. Ara tatil başlangıcı (1 hafta)',endOf('b1',7))}${sf('sem','Yarıyıl tatili başlangıcı (2 hafta)',endOf('sem',14))}${sf('b2','2. Ara tatil başlangıcı (1 hafta)',endOf('b2',7))}${sf('end','Okulun son günü')}
 
 <label class="f">Yapay zeka modeli</label><select data-s="model">${[...new Set([s.model,...(S.models||[]),...FALLBACK])].map(x=>`<option ${s.model===x?'selected':''}>${x}</option>`).join('')}</select><p class="row"><button class="btn" data-a="listModels">Kullanılabilir modelleri getir</button><button class="btn" data-a="testKey">Bağlantıyı test et</button></p><div class="mut" id="tres"></div></div>

 <textarea id="nk" placeholder="Anahtarları yapıştırın (her satıra bir tane)"></textarea><p><button class="btn p" data-a="addKeys">Anahtarları ekle</button></p>`

 <div class="row"><button class="btn" data-a="togKey" data-id="${k.id}">${k.on===false?'Aç':'Kapat'}</button><button class="btn d" data-a="delKey" data-id="${k.id}">Sil</button></div></div>`}).join('')+`</div><div class="card"><b>Yedekleme</b><p class="mut">Tüm sınıflar, planlar, dosyalar, ders kitapları ve ayarlar tek bir dosyaya kaydedilir. Dosya API anahtarlarınızı da içerir; başkalarıyla paylaşmayın.</p><div class="row"><button class="btn p" data-a="backup">Yedek dosyası indir</button><label class="btn">Yedekten geri yükle<input type="file" hidden accept=".json,application/json" data-f="restore"></label></div></div>`}

/* ---- Olaylar ---- */
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,g=G();
 if(a==='grade'){UI.gid=id;UI.tab='uret';UI.view=null}
 else if(a==='settings')UI.gid='settings';
 else if(a==='addGrade'){const n=prompt('Sınıf / ders adı (örn. 5. Sınıf Matematik)');if(!n)return;const x={id:uid(),name:n.trim(),annual:null,sample:null,book:null,sections:[],plans:[]};S.grades.push(x);UI.gid=x.id;UI.tab='dosya';save()}
 else if(a==='rename'){const n=prompt('Yeni ad',g.name);if(!n)return;g.name=n.trim();save()}
 else if(a==='delGrade'){if(!confirm(`“${g.name}” ve tüm planları silinsin mi?`))return;S.grades=S.grades.filter(x=>x!==g);Books.del(g.id);ttSync();UI.gid=null;save()}
 else if(a==='tab'){UI.tab=id;UI.view=null}
 else if(a==='shift'||a==='today'){const d=a==='today'?new Date():new Date(UI.date+'T00:00');if(a==='shift')d.setDate(d.getDate()+ +id);UI.date=iso(d);$('#dt').value=UI.date;return updWeek()}
 else if(a==='gen'){UI.date=$('#dt').value||UI.date;UI.err='';b.disabled=true;let sec=0;STAGE='Başlıyor…';b.textContent=STAGE;
  const tk=setInterval(()=>{sec++;b.textContent=`${STAGE} ${sec} sn`},1000);
  try{const ps=await generate(g,UI.date,$('#note').value.trim(),$('#usebook')&&$('#usebook').checked);if(ps&&ps.length){UI.tab='planlar';UI.view=ps[0].id}}
  catch(err){UI.err='Hata: '+err.message;toast(err.message)}
  clearInterval(tk);b.disabled=false}
 else if(a==='open')UI.view=id;
 else if(a==='close')UI.view=null;
 else if(a==='savePlan'){g.plans.find(p=>p.id===id).html=clean($('#doc').innerHTML);save();return toast('Kaydedildi.')}
 else if(a==='backup'){const books={};for(const g of S.grades)if(g.book){const v=await Books.get(g.id);if(v)books[g.id]=v}
  dl(new Blob([JSON.stringify({v:1,S,books})],{type:'application/json'}),'gunluk-plan-yedek-'+iso(new Date())+'.json');return}
 else if(a==='program')UI.gid='program';
 else if(a==='genAll'){UI.date=$('#pdt').value||UI.date;UI.err='';b.disabled=true;let ok=0;const fail=[];
  for(const x of S.grades){if(!x.annual||!x.sample)continue;b.textContent=x.name+' üretiliyor…';
   try{const ps=await generate(x,UI.date,'',!!x.book);if(ps)ok+=ps.length}catch(err){fail.push(x.name+': '+err.message)}}
  UI.err=fail.join(' | ');toast(ok+' plan üretildi.');b.disabled=false}
 else if(a==='ttOk'){S.tt.mig=false;ttSync();save()}
 else if(a==='resetTpl'){delete g.sample.tpl;save()}
 else if(a==='testKey'){const k=S.keys[0],o=$('#tres');if(!k)return toast('Önce bir API anahtarı ekleyin.');o.textContent='Deneniyor…';
  try{const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${S.settings.model}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k.key},body:JSON.stringify({contents:[{parts:[{text:'Merhaba de'}]}]})});
   const j=await r.json();o.textContent=r.ok?'Çalışıyor. Model: '+S.settings.model:'HTTP '+r.status+' ('+S.settings.model+'): '+(j.error&&j.error.message||'').slice(0,300)}
  catch(err){o.textContent='Bağlantı hatası: '+err.message}return}
 else if(a==='listModels'){const k=S.keys[0];if(!k)return toast('Önce bir API anahtarı ekleyin.');
  try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':k.key}});const j=await r.json();
   if(!r.ok)throw new Error(j.error?.message||r.status);
   S.models=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')&&/flash/.test(m.name)&&!/image|tts|live|audio|embed|vision|exp/.test(m.name)).map(m=>m.name.replace('models/','')).sort().reverse();
   if(S.models.length&&!S.models.includes(S.settings.model))S.settings.model=S.models[0];save();toast(S.models.length+' model bulundu. Seçili: '+S.settings.model)}
  catch(err){toast('Model listesi alınamadı: '+err.message)}}
 else if(a==='addSec'){const n=prompt('Şube adı (örn. 9-A)');if(!n)return;g.sections.push({id:uid(),name:n.trim(),hours:0,sched:{},slots:{},days:''});save()}
 else if(a==='delSec'){g.sections=g.sections.filter(x=>x.id!==id);ttSync();save()}
 else if(a==='delPlan'){if(!confirm('Bu plan silinsin mi?'))return;g.plans=g.plans.filter(p=>p.id!==id);if(UI.view===id)UI.view=null;save()}
 else if(a==='exp'){const p=g.plans.find(x=>x.id===id);return doExport([p],`${g.name}-${p.secName?p.secName+'-':''}${p.week}-hafta`,b.dataset.f,b)}
 else if(a==='expWeek')return doExport(g.plans.filter(p=>p.week===+id),`${g.name}-${id}-hafta-tum-subeler`,b.dataset.f,b);
 else if(a==='expAll')return doExport(g.plans,`${g.name}-tum-planlar`,b.dataset.f,b);
 else if(a==='delFile'){if(!confirm('Dosya silinsin mi?'))return;g[id]=null;if(id==='book')Books.del(g.id);save()}
 else if(a==='addKeys'){const ks=$('#nk').value.split(/[\s,]+/).map(x=>x.trim()).filter(x=>x.length>20);
  ks.forEach(k=>{if(!S.keys.some(x=>x.key===k))S.keys.push({id:uid(),key:k,tokens:0,day:iso(new Date()),on:true})});save();toast(ks.length+' anahtar işlendi.')}
 else if(a==='togKey'){const k=S.keys.find(x=>x.id===id);k.on=k.on===false;save()}
 else if(a==='delKey'){S.keys=S.keys.filter(x=>x.id!==id);save()}
 render();
});
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.id==='dt'){UI.date=t.value;return updWeek()}
 if(t.id==='pdt'){UI.date=t.value;return render()}
 if(t.dataset.s){S.settings[t.dataset.s]=t.value;save();return render()}
 if(t.dataset.t){G()[t.dataset.t].text=t.value;return save()}
 if(t.dataset.ft!==undefined){G().sample.tpl.alanlar[+t.dataset.ft].tur=t.value;return save()}
 if(t.dataset.tt){const[d,p]=t.dataset.tt.split(':').map(Number);S.tt.d[d][p]=t.value;ttSync();save();return render()}
 if(t.dataset.ttn){const n=+t.value,T=S.tt;if(T.d.some(r=>r.slice(n).some(Boolean))&&!confirm('Saat sayısı azaltılınca son saatlerdeki dersler silinecek. Devam edilsin mi?'))return render();T.n=n;ttSync();save();return render()}
 if(t.dataset.sn||t.dataset.sh||t.dataset.sd){const x=G().sections.find(y=>y.id===(t.dataset.sn||t.dataset.sh||t.dataset.sd));
  if(t.dataset.sn)x.name=t.value.trim();else if(t.dataset.sh)x.hours=+t.value;else x.days=t.value.trim();save();return render()}
 if(t.dataset.f==='restore'&&t.files[0]){
  try{const j=JSON.parse(await t.files[0].text());if(!j.S||!j.S.grades)throw new Error('Geçersiz yedek dosyası.');
   if(!confirm('Mevcut tüm veriler yedekteki verilerle değiştirilsin mi?'))return;
   S=j.S;S.settings=Object.assign({school:'',teacher:'',teacherTitle:'',principal:'',principalTitle:'Okul Müdürü',start:'',end:'',b1:'',sem:'',b2:'',model:'gemini-3.8-flash'},S.settings);
   S.keys=S.keys||[];S.grades.forEach(g=>{g.sections=g.sections||[];g.plans=g.plans||[]});ttInit();
   for(const id in (j.books||{}))await Books.set(id,j.books[id]);
   save();UI.gid=null;toast('Yedek geri yüklendi.');render()}catch(err){toast(err.message)}return}
 if(t.dataset.f==='book'&&t.files[0]){const f=t.files[0];
  try{if(!/\.pdf$/i.test(f.name))throw new Error('Ders kitabı PDF olmalı.');
   const pages=await pdfPages(f,(i,n)=>toast(`Kitap okunuyor… ${i}/${n} sayfa`));
   if(pages.join('').trim().length<200)throw new Error('Kitaptan metin okunamadı (taranmış görüntü olabilir).');
   const mode=await Books.set(G().id,{name:f.name,pages});G().book={name:f.name,n:pages.length};save();toast(mode==='mem'?'Kitap yalnızca bu oturumda tutuluyor (tarayıcı depolamaya izin vermiyor); sayfayı kapatınca silinir.':'Ders kitabı kaydedildi.');render()}catch(err){toast(err.message)}return}
 if(t.dataset.f&&t.files[0]){const f=t.files[0];toast('Dosya okunuyor…');
  try{const text=(await readDoc(f)).trim();if(text.length<30)throw new Error('Dosyadan metin okunamadı (taranmış görüntü olabilir).');
   const o={name:f.name,text};
   if(t.dataset.f==='sample'){
    if(/\.docx$/i.test(f.name))o.html=(await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()})).value.replace(/<img[^>]*>/g,'');
    else if(f.size<1.5e6)o.b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(f)})}
   G()[t.dataset.f]=o;save();toast('Dosya kaydedildi.');render()}catch(err){toast(err.message)}}
});
try{navigator.storage.persist()}catch(e){}
S.grades.forEach(g=>{g.plans=g.plans||[]});ttInit();
render();
</script></body></html>
